openapi: "3.0.3"
info:
  title: Dona Presentes API
  description: API do sistema de gestão Dona Presentes — brindes personalizados
  version: "1.0.0"
  contact:
    name: Dona Presentes
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://api.donapresentes.com.br
    description: Produção

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ───────────────────────────── Auth ─────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        refresh_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
    ForgotPasswordRequest:
      type: object
      properties:
        username: { type: string }
    ResetPasswordRequest:
      type: object
      properties:
        token: { type: string }
        new_password: { type: string, format: password }

    # ───────────────────────────── User ─────────────────────────────
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        permissions: { type: array, items: { type: string } }
        full_name: { type: string }
        cpf: { type: string }
        rg: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        status: { type: string }
        contact_email: { type: string, nullable: true }
        full_address: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
        role: { type: string }
        permissions: { type: array, items: { type: string } }
        full_name: { type: string }
        cpf: { type: string }
        rg: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        status: { type: string }
        contact_email: { type: string, nullable: true }
        full_address: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        must_change_password: { type: boolean }

    # ───────────────────────────── Customer ─────────────────────────
    Customer:
      type: object
      properties:
        id: { type: integer }
        customer_type: { type: string }
        status: { type: string }
        name: { type: string }
        trade_name: { type: string }
        company_name: { type: string }
        state_registration: { type: string }
        city_registration: { type: string }
        responsible: { type: string }
        contact_financial_name: { type: string }
        contact_financial_email: { type: string }
        contact_financial_phone: { type: string }
        contact_nf_name: { type: string }
        contact_nf_email: { type: string }
        contact_nf_phone: { type: string }
        contact_commercial_name: { type: string }
        contact_commercial_email: { type: string }
        contact_commercial_phone: { type: string }
        cnpj: { type: string, nullable: true }
        cpf: { type: string, nullable: true }
        email: { type: string }
        business_phone: { type: string }
        mobile_phone: { type: string }
        website: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        additional_contacts: { type: array, items: { $ref: '#/components/schemas/AdditionalContact' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Address:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        address_type: { type: string }
        address_line: { type: string }
    AdditionalContact:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }

    # ───────────────────────────── Supplier ─────────────────────────
    Supplier:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        cnpj: { type: string, nullable: true }
        state_registration: { type: string, nullable: true }
        contact_person: { type: string, nullable: true }
        email: { type: string, nullable: true }
        landline_phone: { type: string, nullable: true }
        mobile_phone: { type: string, nullable: true }
        responsible_email: { type: string, nullable: true }
        commercial_address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        website: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ───────────────────────────── Carrier ──────────────────────────
    Carrier:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        cnpj: { type: string }
        carrier_type: { type: string }
        email: { type: string }
        landline_phone: { type: string }
        mobile_phone: { type: string }
        full_address: { type: string }
        contact_name: { type: string }
        contact_phone: { type: string }
        website: { type: string }

    # ───────────────────────────── Product ──────────────────────────
    Product:
      type: object
      properties:
        id: { type: integer }
        product_name: { type: string }
        internal_code: { type: string }
        supplier_code: { type: string }
        supplier_id: { type: integer }
        supplier: { $ref: '#/components/schemas/Supplier' }
        product_group: { type: string }
        description: { type: string }
        photos: { type: array, items: { type: string } }
        ncm: { type: string }
        material_origin: { type: string }
        stock: { type: integer }
        supplier_stock: { type: integer }
        moves_stock: { type: boolean }
        enabled_for_invoice: { type: boolean }
        cost_price: { type: number, format: float }
        selling_price: { type: number, format: float }
        kit_type: { type: string }
        is_composition: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/ProductItem' } }
        color: { type: string }
        origin: { type: string }
        pending_approval: { type: boolean }
        last_cost: { type: number, format: float }
        last_cost_date: { type: string, format: date, nullable: true }
        last_cost_qty1: { type: integer }
        last_cost_qty2: { type: integer }
        last_cost_qty3: { type: integer }
        last_cost_val1: { type: number, format: float }
        last_cost_val2: { type: number, format: float }
        last_cost_val3: { type: number, format: float }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductItem:
      type: object
      properties:
        id: { type: integer }
        product_parent_id: { type: integer }
        product_id: { type: integer }
        quantity: { type: integer }
        product: { $ref: '#/components/schemas/Product' }

    PaginatedProductResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total_pages: { type: integer }

    # ───────────────────────────── Quote ────────────────────────────
    Quote:
      type: object
      properties:
        id: { type: integer }
        quote_number: { type: string }
        seller_id: { type: integer }
        seller: { $ref: '#/components/schemas/User' }
        customer_id: { type: integer }
        customer: { $ref: '#/components/schemas/Customer' }
        responsible_name: { type: string }
        quote_date: { type: string, format: date, nullable: true }
        quote_valid_until: { type: string, format: date, nullable: true }
        production_lead_time: { type: string }
        total_value: { type: number, format: float }
        items: { type: array, items: { $ref: '#/components/schemas/QuoteItem' } }
        care_of: { type: string }
        sales_channel: { type: string }
        observations: { type: string }
        feedback_date_time: { type: string, format: date-time, nullable: true }
        feedback_observation: { type: string }
        payment_method: { type: string }
        installments: { type: integer }
        installment_dates: { type: object }
        carrier_id: { type: integer, nullable: true }
        carrier: { $ref: '#/components/schemas/Carrier' }
        freight_value: { type: number, format: float }
        freight_tax_id_sender: { type: string }
        freight_tax_id_origin: { type: string }
        freight_tax_id_dest: { type: string }
        freight_tax_id_payer: { type: string }
        freight_tipo_transporte: { type: string }
        freight_contato: { type: string }
        freight_cidade_origem: { type: string }
        freight_cidade_destino: { type: string }
        freight_material: { type: string }
        freight_tipo_frete: { type: string }
        freight_produto: { type: string }
        freight_tipo_embalagem: { type: string }
        freight_quantidade: { type: integer }
        freight_volumes: { type: object }
        freight_valor_nota: { type: number, format: float }
        freight_peso_real: { type: number, format: float }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuoteItem:
      type: object
      properties:
        id: { type: integer }
        quote_id: { type: integer }
        product_id: { type: integer }
        product: { $ref: '#/components/schemas/Product' }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        total_price: { type: number, format: float }
        discount: { type: number, format: float }
        personalization_type: { type: string }
        dn_code: { type: string }
        description_summary: { type: string }
        is_kit: { type: boolean }
        base_cost_unit: { type: number, format: float }
        labor_cost: { type: number, format: float }
        engraving_cost: { type: number, format: float }
        urgency_fee: { type: number, format: float }
        logistics_cost: { type: number, format: float }
        freight_cost: { type: number, format: float }
        tax_percent: { type: number, format: float }
        st_percent: { type: number, format: float }
        seller_commission_percent: { type: number, format: float }
        sale_unit_value: { type: number, format: float }
        margin_percent_calc: { type: number, format: float }
        extra_unit_cost1: { type: number, format: float }
        extra_unit_cost2: { type: number, format: float }
        loss_index_percent: { type: number, format: float }
        imported_labor_percent: { type: number, format: float }
        mgmt_commission_percent: { type: number, format: float }
        agency_commission_percent: { type: number, format: float }
        publicity_percent: { type: number, format: float }
        scrap_index: { type: number, format: float }
        over_percent: { type: number, format: float }
        financial_factor: { type: number, format: float }
        financial_percent: { type: number, format: float }
        transport_apart: { type: number, format: float }
        production_cost_calc: { type: number, format: float }
        transport_cost_calc: { type: number, format: float }
        additional_costs_calc: { type: number, format: float }
        profit_calc: { type: number, format: float }
        cost_unit_calc: { type: number, format: float }
        has_price_formation: { type: boolean }
        engravings: { type: object }

    QuoteInput:
      type: object
      required: [seller_id, customer_id, responsible_name, quote_valid_until, items]
      properties:
        quote_number: { type: string }
        seller_id: { type: integer }
        customer_id: { type: integer }
        responsible_name: { type: string }
        quote_date: { type: string, format: date }
        care_of: { type: string }
        quote_valid_until: { type: string, format: date }
        sales_channel: { type: string }
        production_lead_time: { type: string }
        observations: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/QuoteItemInput' } }
        freight_value: { type: number, format: float }
        carrier_id: { type: integer, nullable: true }
        payment_method: { type: string }
        installments: { type: integer }
        installment_dates: { type: object }
        freight_tax_id_sender: { type: string }
        freight_tax_id_origin: { type: string }
        freight_tax_id_dest: { type: string }
        freight_tax_id_payer: { type: string }
        freight_tipo_transporte: { type: string }
        freight_contato: { type: string }
        freight_cidade_origem: { type: string }
        freight_cidade_destino: { type: string }
        freight_material: { type: string }
        freight_tipo_frete: { type: string }
        freight_produto: { type: string }
        freight_tipo_embalagem: { type: string }
        freight_quantidade: { type: integer }
        freight_volumes: { type: object }
        freight_valor_nota: { type: number, format: float }
        freight_peso_real: { type: number, format: float }
    QuoteItemInput:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id: { type: integer }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        discount: { type: number, format: float }
        personalization_type: { type: string }
        dn_code: { type: string }
        description_summary: { type: string }
        is_kit: { type: boolean }
        engravings: { type: object }
        has_price_formation: { type: boolean }
        base_cost_unit: { type: number, format: float }
        labor_cost: { type: number, format: float }
        extra_unit_cost1: { type: number, format: float }
        extra_unit_cost2: { type: number, format: float }
        engraving_cost: { type: number, format: float }
        urgency_fee: { type: number, format: float }
        logistics_cost: { type: number, format: float }
        freight_cost: { type: number, format: float }
        tax_percent: { type: number, format: float }
        st_percent: { type: number, format: float }
        loss_index_percent: { type: number, format: float }
        imported_labor_percent: { type: number, format: float }
        mgmt_commission_percent: { type: number, format: float }
        seller_commission_percent: { type: number, format: float }
        agency_commission_percent: { type: number, format: float }
        publicity_percent: { type: number, format: float }
        scrap_index: { type: number, format: float }
        over_percent: { type: number, format: float }
        financial_factor: { type: number, format: float }
        financial_percent: { type: number, format: float }
        sale_unit_value: { type: number, format: float }
        transport_apart: { type: number, format: float }
        production_cost_calc: { type: number, format: float }
        transport_cost_calc: { type: number, format: float }
        additional_costs_calc: { type: number, format: float }
        profit_calc: { type: number, format: float }
        margin_percent_calc: { type: number, format: float }
        cost_unit_calc: { type: number, format: float }

    # ───────────────────────────── Sale ─────────────────────────────
    Sale:
      type: object
      properties:
        id: { type: integer }
        seller_id: { type: integer }
        seller: { $ref: '#/components/schemas/User' }
        customer_id: { type: integer }
        customer: { $ref: '#/components/schemas/Customer' }
        status: { type: string }
        is_event: { type: boolean }
        delivery_address: { type: string }
        delivery_date: { type: string, format: date, nullable: true }
        departure_date: { type: string, format: date, nullable: true }
        arrival_date: { type: string, format: date, nullable: true }
        priority: { type: string }
        care_of: { type: string }
        invoice_email: { type: string }
        financial_email: { type: string }
        purchase_order: { type: string }
        external_notes: { type: string }
        internal_notes: { type: string }
        payment_method: { type: string }
        installments: { type: integer }
        total_value: { type: number, format: float }
        items: { type: array, items: { $ref: '#/components/schemas/SaleItem' } }
        carriers: { type: array, items: { $ref: '#/components/schemas/Carrier' } }
        layout_urls: { type: array, items: { type: string } }
    SaleItem:
      type: object
      properties:
        id: { type: integer }
        sale_id: { type: integer }
        product_id: { type: integer }
        product: { $ref: '#/components/schemas/Product' }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        total_price: { type: number, format: float }
        discount: { type: number, format: float }
        price_formation: { type: object }
        engravings: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SaleInput:
      type: object
      required: [seller_id, customer_id, payment_method, items]
      properties:
        seller_id: { type: integer }
        customer_id: { type: integer }
        payment_method: { type: string }
        installments: { type: integer }
        payment_term_days: { type: integer }
        first_installment_start: { type: string, format: date, nullable: true }
        installment_dates: { type: object }
        status: { type: string }
        is_event: { type: boolean }
        delivery_address: { type: string }
        delivery_date: { type: string, format: date, nullable: true }
        departure_date: { type: string, format: date, nullable: true }
        arrival_date: { type: string, format: date, nullable: true }
        priority: { type: string }
        care_of: { type: string }
        invoice_email: { type: string }
        financial_email: { type: string }
        purchase_order: { type: string }
        external_notes: { type: string }
        internal_notes: { type: string }
        layout_urls: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: '#/components/schemas/SaleItemInput' } }
        carrier_ids: { type: array, items: { type: integer } }
    SaleItemInput:
      type: object
      properties:
        product_id: { type: integer }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        engravings: { type: object }

    # ───────────────────────────── Purchase ─────────────────────────
    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        sale_id: { type: integer }
        general_number: { type: string }
        status: { type: string }
        buyer_id: { type: integer, nullable: true }
        material_supplier_id: { type: integer, nullable: true }
        engraving_supplier_id: { type: integer, nullable: true }
        is_sample: { type: boolean }
        has_engraving: { type: boolean }
        corel_required: { type: boolean }
        material_unit_cost: { type: number, format: float }
        material_total_cost: { type: number, format: float }
        engraving_cost: { type: number, format: float }
        freight_cost: { type: number, format: float }
        other_cost: { type: number, format: float }
        buyer_discount: { type: number, format: float }
        material_deadline: { type: string, format: date, nullable: true }
        engraving_deadline: { type: string, format: date, nullable: true }
        payment_method: { type: string }
        first_piece_required: { type: boolean }
        first_piece_status: { type: string }
        sale: { $ref: '#/components/schemas/Sale' }
        material_supplier: { $ref: '#/components/schemas/Supplier' }
        engraving_supplier: { $ref: '#/components/schemas/Supplier' }
        attachments: { type: array, items: { $ref: '#/components/schemas/PurchaseAttachment' } }
        payments: { type: array, items: { $ref: '#/components/schemas/PurchasePayment' } }
        issues: { type: array, items: { $ref: '#/components/schemas/PurchaseIssue' } }
    PurchaseAttachment:
      type: object
      properties:
        id: { type: integer }
        purchase_id: { type: integer }
        category: { type: string }
        file_name: { type: string }
        url: { type: string }
        uploaded_by: { type: integer, nullable: true }
    PurchasePayment:
      type: object
      properties:
        id: { type: integer }
        purchase_id: { type: integer }
        cost_type: { type: string }
        supplier_id: { type: integer, nullable: true }
        amount: { type: number, format: float }
        method: { type: string }
        status: { type: string }
        justification: { type: string }
        receipt_url: { type: string }
        requested_by: { type: integer, nullable: true }
        approved_by: { type: integer, nullable: true }
    PurchaseIssue:
      type: object
      properties:
        id: { type: integer }
        purchase_id: { type: integer }
        issue_type: { type: string }
        description: { type: string }
        supplier_id: { type: integer, nullable: true }
        solution: { type: string }
        priority: { type: integer }
        status: { type: string }
        opened_by: { type: integer, nullable: true }
        resolved_by: { type: integer, nullable: true }

    # ───────────────────────────── Production ───────────────────────
    ProductionOrder:
      type: object
      properties:
        id: { type: integer }
        purchase_id: { type: integer }
        sale_id: { type: integer }
        status: { type: string }
        has_engraving: { type: boolean }
        first_piece_required: { type: boolean }
        priority: { type: integer }
        owner_id: { type: integer, nullable: true }
        version: { type: integer }
        general_number: { type: string }
        customer_name: { type: string }
        departure_date: { type: string, format: date, nullable: true }
        material_deadline: { type: string, format: date, nullable: true }
        engraving_deadline: { type: string, format: date, nullable: true }

    # ───────────────────────────── Layout ───────────────────────────
    ItemLayoutVersion:
      type: object
      properties:
        id: { type: integer }
        entity_type: { type: string }
        item_id: { type: integer }
        version: { type: integer }
        label: { type: string }
        file_url: { type: string }
        approval_status: { type: string }
        approval_note: { type: string }
        approved_by: { type: integer, nullable: true }
        created_by: { type: integer }

    # ───────────────────────────── Error ────────────────────────────
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: string }
        code: { type: integer }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details: { type: string }
        code: { type: integer }

paths:
  # ═══════════════════════════════ AUTH ═══════════════════════════════
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Renovar token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Logout (invalidate refresh tokens)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Dados do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
